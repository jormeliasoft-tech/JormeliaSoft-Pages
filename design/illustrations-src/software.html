<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Outfit'; font-weight:300 800; src:url('outfit-variable.woff2') format('woff2')}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:420px;height:420px;background:transparent}
  .stage{position:relative;width:420px;height:420px;font-family:'Outfit',sans-serif}

  .blob{
    position:absolute; width:380px; height:380px; right:-110px; top:-60px;
    background:linear-gradient(135deg,#7C86F5 0%,#4F5BEF 55%,#2E38B8 100%);
    border-radius:42% 58% 55% 45% / 48% 40% 60% 52%;
    opacity:.17;
  }

  .monitor{
    position:absolute; right:56px; top:70px; width:250px; height:190px;
    background:#020C30; border-radius:18px; padding:16px;
    box-shadow:0 34px 60px -26px rgba(79,91,239,.42), 0 0 0 1px rgba(79,91,239,.08);
    transform:rotate(-3deg);
  }
  .monitor .screen{ width:100%; height:100%; background:#0A1540; border-radius:10px; padding:18px; display:flex; align-items:flex-end; gap:12px; }
  .bar{ flex:1; border-radius:6px 6px 0 0; background:linear-gradient(180deg,#7C86F5,#4F5BEF); }
  .stand{ position:absolute; right:150px; top:250px; width:16px; height:26px; background:#020C30; }
  .base{ position:absolute; right:110px; top:274px; width:96px; height:10px; border-radius:6px; background:#020C30; }

  .gear{
    position:absolute; right:38px; top:36px; width:88px; height:88px; border-radius:50%;
    background:#ffffff; box-shadow:0 18px 32px -14px rgba(79,91,239,.4), 0 0 0 1px rgba(79,91,239,.08);
    display:flex; align-items:center; justify-content:center;
  }
  .gear svg{ width:44px; height:44px; }

  .check{
    position:absolute; right:220px; top:210px; width:56px; height:56px; border-radius:16px;
    background:linear-gradient(135deg,#7C86F5,#4F5BEF);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 16px 28px -12px rgba(79,91,239,.5);
  }
  .check svg{ width:26px; height:26px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="blob"></div>

    <div class="base"></div>
    <div class="stand"></div>
    <div class="monitor">
      <div class="screen">
        <div class="bar" style="height:35%"></div>
        <div class="bar" style="height:65%"></div>
        <div class="bar" style="height:45%"></div>
        <div class="bar" style="height:85%"></div>
        <div class="bar" style="height:55%"></div>
      </div>
    </div>

    <div class="gear">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4F5BEF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 13.5c.1-.5.1-1 0-1.5l1.6-1.2-1.5-2.6-1.9.6c-.4-.3-.8-.6-1.3-.8L15.8 6h-3l-.5 1.9c-.5.2-.9.5-1.3.8l-1.9-.6-1.5 2.6 1.6 1.2c-.1.5-.1 1 0 1.5L7.6 14.7l1.5 2.6 1.9-.6c.4.3.8.6 1.3.8l.5 1.9h3l.5-1.9c.5-.2.9-.5 1.3-.8l1.9.6 1.5-2.6Z"/></svg>
    </div>

    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
    </div>
  </div>
</body>
</html>
