<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Outfit'; font-weight:300 800; src:url('outfit-variable.woff2') format('woff2')}
  @font-face{font-family:'Figtree'; font-weight:400 600; src:url('figtree-variable.woff2') format('woff2')}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:640px;height:480px;background:transparent}
  .stage{position:relative;width:640px;height:480px;font-family:'Figtree',sans-serif}

  .blob{
    position:absolute; width:520px; height:520px; right:-140px; top:-70px;
    background:linear-gradient(135deg,#8B7CF6 0%,#4B17B9 55%,#2E0E7A 100%);
    border-radius:42% 58% 55% 45% / 48% 40% 60% 52%;
    opacity:.16;
  }
  .blob2{
    position:absolute; width:260px; height:260px; right:80px; bottom:-70px;
    background:linear-gradient(135deg,#8B7CF6,#4B17B9);
    border-radius:50% 50% 45% 55% / 55% 45% 55% 45%;
    opacity:.10;
  }

  .phone{
    position:absolute; width:230px; height:400px; background:#020C30; border-radius:38px;
    padding:14px; box-shadow:0 40px 70px -30px rgba(75,23,185,.4), 0 0 0 1px rgba(75,23,185,.08);
  }
  .phone .screen{ width:100%; height:100%; border-radius:26px; background:#F5F7FE; padding:22px 18px; }
  .phone.back{ right:150px; top:46px; transform:rotate(-8deg); opacity:.55; filter:saturate(.7); }
  .phone.front{ right:66px; top:56px; transform:rotate(6deg); }

  .notch{ width:60px; height:8px; border-radius:6px; background:#DCE2F5; margin:0 auto 22px; }
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .app{ width:100%; aspect-ratio:1; border-radius:16px; }
  .app.g1{ background:linear-gradient(135deg,#4CA1FD,#1D4FE0); }
  .app.g2{ background:linear-gradient(135deg,#8B7CF6,#4B17B9); }
  .app.g3{ background:linear-gradient(135deg,#4F5BEF,#2E38B8); }
  .app.g4{ background:#E3E7F7; }
  .app.g5{ background:#E3E7F7; }
  .app.g6{ background:linear-gradient(135deg,#6FE3B4,#2FBE86); }

  .badge{
    position:absolute; width:78px; height:78px; border-radius:24px;
    background:#ffffff; box-shadow:0 18px 32px -14px rgba(75,23,185,.4), 0 0 0 1px rgba(75,23,185,.08);
    display:flex; align-items:center; justify-content:center;
  }
  .badge svg{ width:38px; height:38px; }
  .badge.star{ left:64px; top:64px; }
  .badge.bell{ left:52px; bottom:90px; width:64px; height:64px; }
  .badge.bell svg{ width:30px; height:30px; }

  .pulse{
    position:absolute; left:150px; bottom:58px; width:14px; height:14px; border-radius:50%;
    background:#2FBE86; box-shadow:0 0 0 8px rgba(47,190,134,.18);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="blob"></div>
    <div class="blob2"></div>

    <div class="badge star">
      <svg viewBox="0 0 24 24" fill="#4B17B9"><path d="M12 2.5l2.9 6.3 6.9.7-5.2 4.7 1.6 6.8L12 17.6 5.8 21l1.6-6.8-5.2-4.7 6.9-.7Z"/></svg>
    </div>
    <div class="badge bell">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1D4FE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 12 6 8Z"/><path d="M10 18a2 2 0 0 0 4 0"/></svg>
    </div>
    <div class="pulse"></div>

    <div class="phone back">
      <div class="screen">
        <div class="notch"></div>
        <div class="grid">
          <div class="app g4"></div><div class="app g1"></div><div class="app g4"></div>
          <div class="app g2"></div><div class="app g4"></div><div class="app g3"></div>
        </div>
      </div>
    </div>

    <div class="phone front">
      <div class="screen">
        <div class="notch"></div>
        <div class="grid">
          <div class="app g1"></div><div class="app g2"></div><div class="app g6"></div>
          <div class="app g4"></div><div class="app g3"></div><div class="app g4"></div>
          <div class="app g4"></div><div class="app g4"></div><div class="app g1"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
