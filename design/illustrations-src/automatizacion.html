<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:420px;height:420px;background:transparent}
  .stage{position:relative;width:420px;height:420px}

  .blob{
    position:absolute; width:380px; height:380px; right:-110px; top:-60px;
    background:linear-gradient(135deg,#8FC4FF 0%,#4CA1FD 55%,#1D4FE0 100%);
    border-radius:42% 58% 55% 45% / 48% 40% 60% 52%;
    opacity:.17;
  }

  svg.lines{ position:absolute; inset:0; }

  .node{
    position:absolute; border-radius:50%; background:#fff;
    box-shadow:0 18px 32px -14px rgba(76,161,253,.4), 0 0 0 1px rgba(76,161,253,.08);
    display:flex; align-items:center; justify-content:center;
  }
  .node.main{ width:104px; height:104px; right:150px; top:150px; }
  .node.main svg{ width:52px; height:52px; }
  .node.small{ width:64px; height:64px; }
  .node.small svg{ width:28px; height:28px; }
  .n1{ right:290px; top:70px; }
  .n2{ right:60px; top:80px; }
  .n3{ right:70px; top:270px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="blob"></div>

    <svg class="lines" viewBox="0 0 420 420">
      <path d="M96 108 L 168 200" stroke="#BBD8FF" stroke-width="3" fill="none" stroke-dasharray="2 10" stroke-linecap="round"/>
      <path d="M328 118 L 230 195" stroke="#BBD8FF" stroke-width="3" fill="none" stroke-dasharray="2 10" stroke-linecap="round"/>
      <path d="M318 302 L 240 225" stroke="#BBD8FF" stroke-width="3" fill="none" stroke-dasharray="2 10" stroke-linecap="round"/>
    </svg>

    <div class="node main">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1D4FE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.36"/><path d="M3 12a9 9 0 0 1 15.5-6.36"/><path d="M21 4v6h-6"/><path d="M3 20v-6h6"/></svg>
    </div>

    <div class="node small n1">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4CA1FD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
    </div>
    <div class="node small n2">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4CA1FD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>
    </div>
    <div class="node small n3">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4CA1FD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.5 8.5 0 0 1-4.2-1.1L3 20l1.2-4.9A8.4 8.4 0 1 1 21 11.5Z"/></svg>
    </div>
  </div>
</body>
</html>
