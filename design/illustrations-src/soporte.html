<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:420px;height:420px;background:transparent}
  .stage{position:relative;width:420px;height:420px}

  .blob{
    position:absolute; width:380px; height:380px; right:-110px; top:-60px;
    background:linear-gradient(135deg,#4CA1FD 0%,#1D4FE0 55%,#173F9E 100%);
    border-radius:42% 58% 55% 45% / 48% 40% 60% 52%;
    opacity:.17;
  }

  .main{
    position:absolute; right:80px; top:96px; width:200px; height:200px; border-radius:50%;
    background:#020C30;
    box-shadow:0 34px 60px -24px rgba(29,79,224,.45);
    display:flex; align-items:center; justify-content:center;
  }
  .main svg{ width:96px; height:96px; }

  .shield{
    position:absolute; right:50px; top:250px; width:96px; height:96px; border-radius:26px;
    background:#fff; box-shadow:0 18px 32px -14px rgba(29,79,224,.4), 0 0 0 1px rgba(29,79,224,.08);
    display:flex; align-items:center; justify-content:center;
    transform:rotate(-6deg);
  }
  .shield svg{ width:46px; height:46px; }

  .gear{
    position:absolute; right:280px; top:70px; width:60px; height:60px; border-radius:50%;
    background:#fff; box-shadow:0 16px 28px -12px rgba(29,79,224,.35), 0 0 0 1px rgba(29,79,224,.08);
    display:flex; align-items:center; justify-content:center;
  }
  .gear svg{ width:28px; height:28px; }

  .dot{ position:absolute; width:16px; height:16px; border-radius:50%; background:#4CA1FD; right:64px; top:60px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="blob"></div>

    <div class="dot"></div>
    <div class="gear">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1D4FE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 13.5c.1-.5.1-1 0-1.5l1.6-1.2-1.5-2.6-1.9.6c-.4-.3-.8-.6-1.3-.8L15.8 6h-3l-.5 1.9c-.5.2-.9.5-1.3.8l-1.9-.6-1.5 2.6 1.6 1.2c-.1.5-.1 1 0 1.5L7.6 14.7l1.5 2.6 1.9-.6c.4.3.8.6 1.3.8l.5 1.9h3l.5-1.9c.5-.2.9-.5 1.3-.8l1.9.6 1.5-2.6Z"/></svg>
    </div>

    <div class="main">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 13v-1.5a7.5 7.5 0 0 1 15 0V13"/><rect x="2.5" y="13" width="4" height="6.5" rx="2"/><rect x="17.5" y="13" width="4" height="6.5" rx="2"/></svg>
    </div>

    <div class="shield">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1D4FE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V6z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg>
    </div>
  </div>
</body>
</html>
